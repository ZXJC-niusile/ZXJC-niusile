name: Update Profile Assets

on:
  schedule:
    - cron: '0 16 * * *' # 每天 UTC 16:00 (北京时间 00:00) 准时运行
  workflow_dispatch: # 允许手动运行

# ===============================================
# 🎨 统一颜色配置中心
# ===============================================
env:
  # --- 1. 统计卡片配色 (午夜紫罗兰) ---
  STATS_BG_COLOR: "1f2040"
  STATS_TITLE_COLOR: "9194bf"
  STATS_TEXT_COLOR: "FFD569"
  STATS_ICON_COLOR: "88ABDA"
  STATS_RING_COLOR: "88BFB8"
  # 删除：边框颜色 (隐藏边框)
  # STATS_BORDER_COLOR: "70a5fd"

  # --- 2. 年度进度条配色 (蓝色胶囊) ---
  PROG_BG_COLOR: "24292e"
  PROG_BAR_COLOR: "58a6ff"
  PROG_TEXT_COLOR: "ffffff"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      # ===============================================
      # 1. 运行 Python 生成你专属的年度进度条
      # ===============================================
      - name: Generate Progress Bar
        run: python draw_progress.py

      # ===============================================
      # 2. 回归官方 Action 生成统计卡片 (无边框版)
      # ===============================================
      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GH_PAT }}
          card: stats
          path: image/github_stats.svg
          # 👇 关键修改：hide_border=true，并且删除了 border_color 参数
          options: username=ZXJC-niusile&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&bg_color=${{ env.STATS_BG_COLOR }}&title_color=${{ env.STATS_TITLE_COLOR }}&text_color=${{ env.STATS_TEXT_COLOR }}&icon_color=${{ env.STATS_ICON_COLOR }}&ring_color=${{ env.STATS_RING_COLOR }}

      # ===============================================
      # 3. 提交并推送
      # ===============================================
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add image/progress.svg image/github_stats.svg
          
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update assets (remove border)"
          
          git pull --rebase origin main
          
          git push
